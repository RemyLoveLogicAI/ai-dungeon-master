name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Test before release
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Smoke-test the wheel before publishing
        run: |
          VENV="$RUNNER_TEMP/wheel-venv"
          uv venv "$VENV" --python 3.12
          uv pip install --python "$VENV/bin/python" dist/*.whl
          "$VENV/bin/ai-dungeon-master" | tail -3
          "$VENV/bin/dungeon-master" | tail -3
          "$VENV/bin/dungeon-master-tui" | tail -1
          cd "$(mktemp -d)"
          "$VENV/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import sys

          import combat_schema

          meta = metadata.metadata("ai-dungeon-master")
          assert meta["License-Expression"] == "MIT", meta["License-Expression"]
          assert combat_schema.__file__.startswith(sys.prefix), combat_schema.__file__
          schema = combat_schema.schema_path()
          assert schema.is_file(), f"schema missing from the wheel: {schema}"
          print("licence:", meta["License-Expression"], "| schema:", schema.name)
          PY
        env:
          AI_DM_AUDIO_DIR: ${{ runner.temp }}/ai-dm-audio
      - name: Upload identical release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ai-dungeon-master
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ai-dungeon-master
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate-release-notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
