<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No inline script or style is used, so the page can run under a strict CSP.
       connect-src 'self' covers the same-origin fetch of demo-data.json. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>AI Dungeon Master — browser demo</title>
  <meta name="description" content="A dependency-free browser client that renders the validated agentsurface-blueprint/0.1 envelope produced by the AI Dungeon Master engine.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 id="title">AI Dungeon Master</h1>
      <p id="subtitle" class="muted"></p>
    </div>
    <nav class="tabs" aria-label="Views">
      <button type="button" data-view="onboarding" class="tab active">Onboarding</button>
      <button type="button" data-view="story" class="tab">Story</button>
      <button type="button" data-view="encounter" class="tab">Encounter</button>
      <button type="button" data-view="investigation" class="tab">Investigation</button>
    </nav>
  </header>

  <p class="crumb-row">
    Rendered from <code id="contract">agentsurface-blueprint/0.1</code> ·
    current surface: <span id="crumb" class="crumb"></span> ·
    <span id="hero-badge" class="crumb">Hero: Unassigned</span>
  </p>

  <main id="stage" aria-live="polite"></main>

  <footer class="foot">
    <p class="muted">
      This is a disposable local client, not the production renderer: it draws the
      validated blueprint envelope and routes intents, and it holds no game rules.
      Generated by <code>web/build_demo.py</code>.
    </p>
  </footer>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
