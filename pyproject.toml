[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-dungeon-master"
version = "0.1.0"
description = "Self-contained D20 tactical combat engine with a stance-based encounter AI and procedural audio, in pure stdlib Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["d20", "dungeons-and-dragons", "rules-engine", "procedural-audio", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment :: Role-Playing",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = []

[project.optional-dependencies]
# Optional, and only for schema validation: the engine itself runs on stdlib alone.
# `combat_schema.validate_payload` raises rather than skipping the check when this
# is absent, so a requested verification never quietly passes.
schema = ["jsonschema>=4.18"]

[project.urls]
Repository = "https://github.com/RemyLoveLogicAI/ai-dungeon-master"
Issues = "https://github.com/RemyLoveLogicAI/ai-dungeon-master/issues"

[project.scripts]
dungeon-master = "combat_runner:run_simulated_encounter"
dungeon-master-tui = "tui_runner:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "hypothesis>=6", "jsonschema>=4.18", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
only-include = ["combat_runner.py", "combat_events.py", "combat_log.py", "combat_schema.py", "d20_rules.py", "encounter_ai.py", "audio_synth.py", "game_foundation.py", "genui.py", "tui_runner.py", "schemas/combat-encounter-log-1.schema.json"]
sources = ["."]

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["."]
# Measure the shipped modules, not the tests that exercise them and not the
# nested worktree under .worktrees/, which holds duplicate copies of them.
omit = ["test_*.py", ".worktrees/*"]

[tool.coverage.report]
# Kept here rather than in the workflow so the gate applies to any
# `pytest --cov` run, including a local one. The threshold is set just below the
# measured total rather than at an aspirational round number.
fail_under = 85
show_missing = true
skip_covered = true
