[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-dungeon-master"
version = "0.1.0"
description = "Self-contained D20 tactical combat engine with a stance-based encounter AI and procedural audio, in pure stdlib Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dungeon-master = "combat_runner:run_simulated_encounter"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
only-include = ["combat_runner.py", "d20_rules.py", "encounter_ai.py", "audio_synth.py"]
sources = ["."]

[tool.ruff]
line-length = 100
