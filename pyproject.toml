[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-dungeon-master"
version = "0.1.0"
description = "Self-contained D20 tactical combat engine with stance AI, procedural audio, generative UI, and multi-surface DM experience."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
]

[project.scripts]
dungeon-master = "combat_runner:run_simulated_encounter"
dm-desktop = "desktop_launcher:main"
dm-tui = "engine.dm_tui:run_tui"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
only-include = ["combat_runner.py", "d20_rules.py", "encounter_ai.py", "audio_synth.py", "desktop_launcher.py", "engine"]
sources = ["."]

[tool.ruff]
line-length = 100
